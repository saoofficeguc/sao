# Publishes the portal's pages on GitHub Pages on every push to main.
# One-time setup: repository > Settings > Pages > Source: "GitHub Actions".
# Only the page files are published (never the server code or data).
name: Deploy pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page files
        run: |
          mkdir site
          cp index.html app.js forms.js docfill.js styles.css config.js manifest.webmanifest site/
          cp -r assets templates site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
