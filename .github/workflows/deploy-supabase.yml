# Deploys the portal's server (the "sao" Supabase Edge Function) on every push to main that changes it.
# One-time setup: repository > Settings > Secrets and variables > Actions > Secrets:
#   SUPABASE_ACCESS_TOKEN = a personal access token from supabase.com/dashboard/account/tokens
name: Deploy server (Supabase)
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'forms.js', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:
concurrency:
  group: supabase
  cancel-in-progress: false
env:
  PROJECT_REF: chrgfpssxaapsghcgxql
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Share the form rules with the function
        run: cp forms.js supabase/functions/_shared/forms.js
      - name: Deploy the function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sao --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
