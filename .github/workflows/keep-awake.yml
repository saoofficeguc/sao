# Calls the portal's server once a day so the free Supabase project never pauses for inactivity.
name: Keep the portal awake
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the server
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 60 "https://chrgfpssxaapsghcgxql.supabase.co/functions/v1/sao/api/session" > /dev/null && echo "Portal is up"
