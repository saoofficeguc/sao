# Copies the portal to the Hugging Face Space on every push to main (and when run by hand from the Actions tab).
# One-time setup in GitHub > repository > Settings > Secrets and variables > Actions:
#   Secret   HF_TOKEN  = a Hugging Face access token with Write permission
#   Variable HF_SPACE  = <your-hf-username>/sao-portal
# The Supabase settings are NOT here: they are set in the Space's own Settings > Variables and secrets.
name: Deploy to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-huggingface
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the Space repository
        run: |
          mkdir /tmp/space
          git ls-files -z | xargs -0 -I{} cp --parents {} /tmp/space/
          cd /tmp/space
          rm -rf .github
          # The Space reads its settings from the top of README.md
          {
            printf -- '---\ntitle: SAO Portal\nemoji: ✅\ncolorFrom: red\ncolorTo: yellow\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'
            printf 'GUC Student Activities Office portal. Open it at the direct link (https://<space>.hf.space).\n\n'
            cat README.md
          } > README.tmp && mv README.tmp README.md
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd /tmp/space
          git lfs install
          git init -q -b main
          git config user.name "SAO deploy"
          git config user.email "deploy@users.noreply.huggingface.co"
          # Hugging Face stores pictures and Word files as large files
          git lfs track "*.png" "*.jpg" "*.jpeg" "*.webp" "*.ico" "*.docx" "*.pdf"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
