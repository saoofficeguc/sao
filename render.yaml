# Render blueprint: Render > New > Blueprint > pick this repository.
# The two Supabase values are asked for when the blueprint is created (they are secrets, never put them in this file).
services:
  - type: web
    name: sao-portal
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/session
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SAO_SECURE_COOKIES
        value: "1"
